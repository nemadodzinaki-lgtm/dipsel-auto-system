ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Uploaded files are data, never executable application code.
<DirectoryMatch "^/var/www/html/(?:uploads|assets/uploads)(?:/|$)">
    <FilesMatch "\.(?:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
